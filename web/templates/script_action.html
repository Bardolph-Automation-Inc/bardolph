<html>

<head>
<title>{{ title }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" type="text/css" href="/static/styles.css" />

{% if icon is defined %}
  <link rel="icon" sizes="192x192" href="/static/{{ icon }}-192.png" />
  <link rel="icon" sizes="512x512" href="/static/{{ icon }}-512.png" />
{% endif %}

<script language='javascript'>var path_root = '{{ path_root }}';</script>
<script src="/static/{{ js_file }}"></script>

</head>

<body class="{{ agent_class }} launched" onLoad="addEvents()">

{% if agent_class != "tv" %}
<div class="title shadow">
<img src="/static/logo.png" class="logoTitle">
</div>
{% endif %}

<div class="main">
    <div class="statusColumn">
        <div class="lightCommand statusRow {{ agent_class }}"
            style="color: {{ color }}; background-color: {{ background_color }}">
            <code>{{ file_name }}</code>
        {% if message %}
            &nbsp; &nbsp; {{message}}
        {% endif %}
        </div>

        <div class="lightCommand statusRow homeButton" id="">Home</div>
    </div>
</div>

</body>
