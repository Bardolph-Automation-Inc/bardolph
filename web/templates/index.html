<html>

<head>
<title>Bardolph</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link
  rel="stylesheet" type="text/css"
  href="/static/styles.css" />

{% if icon is defined %}
  <link rel="icon" sizes="192x192" href="/static/{{ icon }}-192.png" />
  <link rel="icon" sizes="512x512" href="/static/{{ icon }}-512.png" />
{% endif %}

<script language='javascript'>var path_root = '{{ path_root }}';</script>
<script src='/static/{{ js_file }}'></script>

</head>

<body class="{{ agent_class }}" onLoad="addEvents()">

<div class="main">
    <div class="title shadow">
        <img src="/static/logo.png" class="logoTitle">
    </div>

    {% for script in scripts %}
    {% if loop.index is not even %}
    <div class="commandRow {{ agent_class }}">
    {% endif %}
        <div
            {% if script.path in running %}
            class = "lightCommand running {{ agent_class }}"
            {% else %}
            class = "lightCommand {{ agent_class}}"
            {% endif %}
            style = "color: {{ script.button_spec.color }}; background: {{ script.button_spec.background }}"
            id= "{{ script.path }}">
            {% if script.path in running %}<img src="/static/litBulb-32.png"/>{% endif %}
            {{ script.button_spec.title }}
        </div>
    {% if loop.index is even or loop.last %}
    </div>
    {% endif %}
    {% endfor %}
</div>

</body>
</html>
